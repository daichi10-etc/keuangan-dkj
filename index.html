body{

select,

}

}


.summary-total{

  border-top:
    1px solid #ddd;

  margin-top:8px;

  padding-top:12px;

}


.expense-item{

}


.expense-head{

  display:flex;

  align-items:center;

}


.expense-number{

}


.remove-btn{

  margin:0;

  padding:6px 10px;

  border:none;

  border-radius:8px;

  background:#eee;

  color:#777;

  font-size:12px;

}


.add-btn{

  width:100%;

  margin-top:12px;

  padding:12px;

  border:
    2px dashed #ff758c;

  border-radius:12px;

  background:#fff;

  color:#ff4d6d;

  font-weight:bold;

  font-size:14px;

}


.main-btn{

  width:100%;

  margin-top:22px;

  padding:15px;

  border:none;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #ff4d6d,
      #ff758c
    );

  color:#fff;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}


.main-btn:disabled{

  background:#aaa;

  cursor:not-allowed;

}


.status{

  display:none;

  margin-top:15px;

  padding:13px;

  border-radius:12px;

  text-align:center;

  font-weight:bold;

}


.status.success{

  display:block;

  background:#e8f8ed;

  color:#188542;

}


.status.error{

  display:block;

  background:#fdecec;

  color:#c62828;

}


.status.loading{

  display:block;

  background:#fff5e5;

  color:#a86600;

}


.note{

  margin-top:12px;

  text-align:center;

  color:#888;

  font-size:12px;

}

</style>

<div class="container">

  type="button"

  onclick="tambahPengeluaran()"

</span>

</strong>

<span>
Pengeluaran Non-CASH
</span>

Rp0

<strong>
Sisa Cash
</strong>

     CATATAN

<div class="section">


<label>
📝 Catatan
</label>


<textarea
  id="catatan"

></textarea>


</div>



<!-- ================================
     KIRIM
================================ -->

<button
  type="button"
  class="main-btn"
  id="kirimBtn"

>

🚀 KIRIM LAPORAN

</button>

  id="status"
  class="status"
></div>

Pastikan angka sudah benar
sebelum mengirim laporan.

</div>


</div>

<script>


/* =========================================================
   URL BACKEND
========================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxPBMSGLb-HV9yk7LPWb5HL1IKFYzaj5dL5DYJbHFPHyscKHFchso9UYvsxkTvbawxvdA/exec";


/* =========================================================
   DATA MASTER
========================================================= */

let masterCabang = [];

let masterUsers = [];

let sumberPengeluaran = [];

let userTerpilih = null;

let sedangMengirim = false;



/* =========================================================
   FORMAT RUPIAH
========================================================= */

function rupiah(angka){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(angka || 0);

}



/* =========================================================
   AMBIL ANGKA
========================================================= */

function angka(id){

  return Number(
    document.getElementById(id).value
  ) || 0;

}



/* =========================================================
   LOAD MASTER
========================================================= */

async function loadMaster(){

  try{

    const response =
      await fetch(SCRIPT_URL);


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Gagal mengambil MASTER"
      );

    }


    masterCabang =
      result.master.cabang || [];


    masterUsers =
      result.master.users || [];


    sumberPengeluaran =
      result.master.sumberPengeluaran || [];


    const penginputSelect =
      document.getElementById(
        "penginput"
      );


    penginputSelect.innerHTML =
      '<option value="">Pilih nama penginput</option>';


    masterUsers.forEach(
      function(user){

        if(
          user.status !== "AKTIF"
        ){

          return;

        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          user.nama;


        option.textContent =
          user.nama;


        penginputSelect.appendChild(
          option
        );

      }
    );


    resetCabang();


  }catch(error){

    console.error(error);


    document.getElementById(
      "penginput"
    ).innerHTML =
      '<option value="">Gagal memuat penginput</option>';


    tampilStatus(
      "❌ Gagal memuat data MASTER.",
      "error"
    );

  }

}



/* =========================================================
   PILIH USER
========================================================= */

function pilihUser(){

  const nama =
    document.getElementById(
      "penginput"
    ).value;


  const cabangSelect =
    document.getElementById(
      "cabang"
    );


  const userInfo =
    document.getElementById(
      "userInfo"
    );


  userTerpilih =
    masterUsers.find(
      function(user){

        return (
          user.nama === nama &&
          user.status === "AKTIF"
        );

      }
    );


  cabangSelect.innerHTML = "";


  if(!userTerpilih){

    resetCabang();

    userInfo.style.display =
      "none";

    return;

  }


  userInfo.style.display =
    "block";


  userInfo.innerText =
    "Role: " +
    userTerpilih.role;


  /* -----------------------------------------
     OWNER
  ----------------------------------------- */

  if(
    userTerpilih.role === "OWNER"
  ){

    cabangSelect.innerHTML =
      '<option value="">Pilih cabang</option>';


    masterCabang.forEach(
      function(namaCabang){

        tambahOptionCabang(
          cabangSelect,
          namaCabang
        );

      }
    );


    cabangSelect.disabled =
      false;


    return;

  }


  /* -----------------------------------------
     KASIR
  ----------------------------------------- */

  const daftarCabang =
    userTerpilih.cabang || [];


  if(
    daftarCabang.length === 1
  ){

    tambahOptionCabang(
      cabangSelect,
      daftarCabang[0]
    );


    cabangSelect.value =
      daftarCabang[0];


    cabangSelect.disabled =
      true;


    userInfo.innerText =
      "Role: " +
      userTerpilih.role +
      " • Cabang: " +
      daftarCabang[0];


    return;

  }


  if(
    daftarCabang.length > 1
  ){

    cabangSelect.innerHTML =
      '<option value="">Pilih cabang</option>';


    daftarCabang.forEach(
      function(namaCabang){

        tambahOptionCabang(
          cabangSelect,
          namaCabang
        );

      }
    );


    cabangSelect.disabled =
      false;


    userInfo.innerText =
      "Role: " +
      userTerpilih.role +
      " • " +
      daftarCabang.length +
      " cabang";

    return;

  }


  resetCabang();

}



/* =========================================================
   OPTION CABANG
========================================================= */

function tambahOptionCabang(
  select,
  nama
){

  const option =
    document.createElement(
      "option"
    );


  option.value =
    nama;


  option.textContent =
    nama;


  select.appendChild(
    option
  );

}



/* =========================================================
   RESET CABANG
========================================================= */

function resetCabang(){

  const cabangSelect =
    document.getElementById(
      "cabang"
    );


  cabangSelect.innerHTML =
    '<option value="">Pilih nama terlebih dahulu</option>';


  cabangSelect.disabled =
    true;

}



/* =========================================================
   HITUNG TOTAL PENDAPATAN
========================================================= */

function hitungPendapatan(){

  hitungRingkasan();

}



/* =========================================================
   TAMBAH PENGELUARAN
========================================================= */

function tambahPengeluaran(){

  const container =
    document.getElementById(
      "expenseList"
    );


  const index =
    container.children.length;


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "expense-item";


  let options =
    '<option value="">Pilih sumber</option>';


  sumberPengeluaran.forEach(
    function(sumber){

      options +=
        `<option value="${escapeHtml(sumber)}">
          ${escapeHtml(sumber)}
        </option>`;

    }
  );


  item.innerHTML = `

    <div class="expense-head">

      <div class="expense-number">
        Pengeluaran ${index + 1}
      </div>

      <button
        type="button"
        class="remove-btn"
        onclick="hapusPengeluaran(this)"
      >
        Hapus
      </button>

    </div>


    <label>
      Sumber
    </label>

    <select class="expense-source">
      ${options}
    </select>


    <label>
      Keperluan
    </label>

    <input
      type="text"
      class="expense-name"
      placeholder="Contoh: Gas, es batu, belanja bahan"
    >


    <label>
      Metode Pembayaran
    </label>

    <select class="expense-method">

      <option value="CASH">
        CASH
      </option>

      <option value="TRANSFER">
        TRANSFER
      </option>

      <option value="QR">
        QR
      </option>

    </select>


    <label>
      Nominal
    </label>

    <input
      type="number"
      class="expense-amount"
      min="0"
      inputmode="numeric"
      placeholder="0"
      oninput="hitungRingkasan()"
    >

  `;


  container.appendChild(
    item
  );


  hitungRingkasan();

}



/* =========================================================
   HAPUS PENGELUARAN
========================================================= */

function hapusPengeluaran(button){

  const item =
    button.closest(
      ".expense-item"
    );


  if(item){

    item.remove();

  }


  rapikanNomorPengeluaran();

  hitungRingkasan();

}



/* =========================================================
   RAPIKAN NOMOR
========================================================= */

function rapikanNomorPengeluaran(){

  const items =
    document.querySelectorAll(
      ".expense-item"
    );


  items.forEach(
    function(item,index){

      item.querySelector(
        ".expense-number"
      ).innerText =
        "Pengeluaran " +
        (index + 1);

    }
  );

}



/* =========================================================
   HITUNG RINGKASAN
========================================================= */

function hitungRingkasan(){

  let totalPengeluaran = 0;

  let pengeluaranCash = 0;


  document
    .querySelectorAll(
      ".expense-item"
    )
    .forEach(
      function(item){

        const nominal =
          Number(
            item.querySelector(
              ".expense-amount"
            ).value
          ) || 0;


        const metode =
          item.querySelector(
            ".expense-method"
          ).value;


        totalPengeluaran +=
          nominal;


        if(
          metode === "CASH"
        ){

          pengeluaranCash +=
            nominal;

        }

      }
    );


  const totalPendapatan =

    angka("cash") +
    angka("transfer") +
    angka("qr") +
    angka("grab") +
    angka("gojek") +
    angka("shopee");


  const pengeluaranNonCash =
    totalPengeluaran -
    pengeluaranCash;


  const sisaCash =
    angka("cash") -
    pengeluaranCash;


  document.getElementById(
    "totalPendapatan"
  ).innerText =
    rupiah(totalPendapatan);


  document.getElementById(
    "totalPengeluaran"
  ).innerText =
    rupiah(totalPengeluaran);


  document.getElementById(
    "pengeluaranCash"
  ).innerText =
    rupiah(pengeluaranCash);


  document.getElementById(
    "pengeluaranNonCash"
  ).innerText =
    rupiah(pengeluaranNonCash);


  document.getElementById(
    "sisaCash"
  ).innerText =
    rupiah(sisaCash);

}



/* =========================================================
   KIRIM LAPORAN
========================================================= */

async function kirimLaporan(){

  if(sedangMengirim){

    return;

  }


  const penginput =
    document.getElementById(
      "penginput"
    ).value;


  const cabang =
    document.getElementById(
      "cabang"
    ).value;


  if(!penginput){

    tampilStatus(
      "⚠️ Silakan pilih nama penginput.",
      "error"
    );

    return;

  }


  if(!cabang){

    tampilStatus(
      "⚠️ Silakan pilih cabang.",
      "error"
    );

    return;

  }


  if(!userTerpilih){

    tampilStatus(
      "⚠️ Data penginput tidak valid.",
      "error"
    );

    return;

  }


  /* -----------------------------------------
     CEK AKSES FRONTEND
  ----------------------------------------- */

  if(
    userTerpilih.role !== "OWNER"
  ){

    const punyaAkses =
      (
        userTerpilih.cabang || []
      ).includes(cabang);


    if(!punyaAkses){

      tampilStatus(
        "❌ User tidak memiliki akses ke cabang ini.",
        "error"
      );

      return;

    }

  }


  const expenseItems =
    document.querySelectorAll(
      ".expense-item"
    );


  const pengeluaran = [];


  for(
    const item of expenseItems
  ){

    const sumber =
      item.querySelector(
        ".expense-source"
      ).value;


    const keperluan =
      item.querySelector(
        ".expense-name"
      ).value.trim();


    const metodePembayaran =
      item.querySelector(
        ".expense-method"
      ).value;


    const nominal =
      Number(
        item.querySelector(
          ".expense-amount"
        ).value
      ) || 0;


    if(
      !sumber &&
      !keperluan &&
      nominal === 0
    ){

      continue;

    }


    if(!sumber){

      tampilStatus(
        "⚠️ Pilih sumber untuk setiap pengeluaran.",
        "error"
      );

      return;

    }


    if(!keperluan){

      tampilStatus(
        "⚠️ Isi keperluan pengeluaran.",
        "error"
      );

      return;

    }


    if(nominal <= 0){

      tampilStatus(
        "⚠️ Isi nominal pengeluaran dengan benar.",
        "error"
      );

      return;

    }


    pengeluaran.push({

      sumber:
        sumber,

      keperluan:
        keperluan,

      metodePembayaran:
        metodePembayaran,

      nominal:
        nominal

    });

  }


  sedangMengirim =
    true;


  const tombol =
    document.getElementById(
      "kirimBtn"
    );


  tombol.disabled =
    true;


  tombol.innerText =
    "⏳ MENGIRIM LAPORAN...";


  tampilStatus(
    "⏳ Laporan sedang dikirim, jangan tutup halaman.",
    "loading"
  );


  try{

    /* ---------------------------------------
       1. PENDAPATAN
    --------------------------------------- */

    const pendapatanData = {

      tipe:
        "pemasukan",

      penginput:
        penginput,

      cabang:
        cabang,

      cash:
        angka("cash"),

      transfer:
        angka("transfer"),

      qr:
        angka("qr"),

      grab:
        angka("grab"),

      gojek:
        angka("gojek"),

      shopee:
        angka("shopee"),

      catatan:
        document.getElementById(
          "catatan"
        ).value.trim()

    };


    const hasilPendapatan =
      await kirimKeBackend(
        pendapatanData
      );


    if(
      !hasilPendapatan.success
    ){

      throw new Error(
        hasilPendapatan.message ||
        "Pendapatan gagal disimpan"
      );

    }


    /* ---------------------------------------
       2. PENGELUARAN
    --------------------------------------- */

    for(
      const expense of pengeluaran
    ){

      const dataPengeluaran = {

        tipe:
          "pengeluaran",

        penginput:
          penginput,

        cabang:
          cabang,

        sumber:
          expense.sumber,

        keperluan:
          expense.keperluan,

        metodePembayaran:
          expense.metodePembayaran,

        nominal:
          expense.nominal,

        catatan:
          document.getElementById(
            "catatan"
          ).value.trim()

      };


      const hasilPengeluaran =
        await kirimKeBackend(
          dataPengeluaran
        );


      if(
        !hasilPengeluaran.success
      ){

        throw new Error(
          hasilPengeluaran.message ||
          "Pengeluaran gagal disimpan"
        );

      }

    }


    tampilStatus(
      "✅ TRANSAKSI BERHASIL — Laporan berhasil disimpan.",
      "success"
    );


    kosongkanForm();


  }catch(error){

    console.error(error);


    tampilStatus(
      "❌ TRANSAKSI GAGAL — Data belum berhasil disimpan. Form tetap dipertahankan.",
      "error"
    );


  }finally{

    sedangMengirim =
      false;


    tombol.disabled =
      false;


    tombol.innerText =
      "🚀 KIRIM LAPORAN";

  }

}



/* =========================================================
   KIRIM KE BACKEND
========================================================= */

async function kirimKeBackend(data){

  const response =
    await fetch(
      SCRIPT_URL,
      {
        method:"POST",
        body:JSON.stringify(data)
      }
    );


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "Backend mengembalikan respons yang tidak valid."
    );

  }


  return result;

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
