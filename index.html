<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DEKAJE GROUP FINANCE</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  min-height:100vh;
}

.container{
  max-width:560px;
  margin:auto;
}

.box{
  background:#fff;
  padding:24px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
  text-align:center;
  margin:0;
  color:#ff4d6d;
  font-size:26px;
}

.sub{
  text-align:center;
  color:#777;
  margin:6px 0 24px;
  font-size:14px;
}

.section{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #eee;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  color:#333;
  margin-bottom:12px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-weight:bold;
  color:#444;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  background:#fff;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#ff6b81;
}

input[type="number"]{
  text-align:right;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.locked{
  background:#f5f5f5;
  color:#777;
}

.summary{
  margin-top:18px;
  padding:16px;
  border-radius:15px;
  background:#f8f8f8;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0;
  color:#555;
}

.summary-row strong{
  color:#222;
}

.summary-total{
  border-top:1px solid #ddd;
  margin-top:8px;
  padding-top:12px;
  font-size:18px;
}

.expense-item{
  border:1px solid #e5e5e5;
  border-radius:15px;
  padding:14px;
  margin-top:12px;
  background:#fafafa;
}

.expense-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
}

.expense-number{
  font-weight:bold;
  color:#444;
}

.remove-btn{
  width:auto;
  margin:0;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  background:#eee;
  color:#777;
  font-size:12px;
  cursor:pointer;
}

.add-btn{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:2px dashed #ff758c;
  border-radius:12px;
  background:#fff;
  color:#ff4d6d;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

.main-btn{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#ff4d6d,#ff758c);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.main-btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.status.success{
  display:block;
  background:#e8f8ed;
  color:#188542;
}

.status.error{
  display:block;
  background:#fdecec;
  color:#c62828;
}

.status.loading{
  display:block;
  background:#fff5e5;
  color:#a86600;
}

.note{
  margin-top:12px;
  text-align:center;
  color:#888;
  font-size:12px;
}

.user-info{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f8f8f8;
  font-size:13px;
  color:#666;
}

.user-info strong{
  color:#333;
}

.hidden{
  display:none;
}

</style>

</head>


<body>

<div class="container">

<div class="box">

<h1>💰 DEKAJE GROUP FINANCE</h1>

<div class="sub">
Laporan Keuangan Harian
</div>


<!-- =====================================================
     IDENTITAS PENGINPUT
===================================================== -->

<div>

<label>👤 Nama Penginput</label>

<select id="penginput">
  <option value="">Memuat pengguna...</option>
</select>


<label>🏢 Cabang</label>

<select id="cabang">
  <option value="">Pilih cabang</option>
</select>


<div
  id="userInfo"
  class="user-info hidden"
></div>

</div>


<!-- =====================================================
     PENDAPATAN
===================================================== -->

<div class="section">

<div class="section-title">
💰 Pendapatan
</div>


<label>💵 Cash</label>

<input
  type="number"
  id="cash"
  min="0"
  inputmode="numeric"
  placeholder="0"
/>


<label>🏦 Transfer</label>

<input
  type="number"
  id="transfer"
  min="0"
  inputmode="numeric"
  placeholder="0"
/>


<label>📱 QR</label>

<input
  type="number"
  id="qr"
  min="0"
  inputmode="numeric"
  placeholder="0"
/>


<label>🛵 Grab</label>

<input
  type="number"
  id="grab"
  min="0"
  inputmode="numeric"
  placeholder="0"
/>


<label>🛵 Gojek</label>

<input
  type="number"
  id="gojek"
  min="0"
  inputmode="numeric"
  placeholder="0"
/>


<label>🛍️ Shopee</label>

<input
  type="number"
  id="shopee"
  min="0"
  inputmode="numeric"
  placeholder="0"
/>


<div class="summary">

<div class="summary-row summary-total">

<strong>Total Pendapatan</strong>

<strong id="totalPendapatan">
Rp0
</strong>

</div>

</div>

</div>


<!-- =====================================================
     PENGELUARAN
===================================================== -->

<div class="section">

<div class="section-title">
💸 Pengeluaran Operasional
</div>


<div id="expenseList"></div>


<button
  type="button"
  class="add-btn"
  id="addExpenseBtn"
  onclick="tambahPengeluaran()"
>

+ Tambah Pengeluaran

</button>


<div class="summary">

<div class="summary-row">

<span>Total Pengeluaran</span>

<strong id="totalPengeluaran">
Rp0
</strong>

</div>


<div class="summary-row">

<span>Pengeluaran Cash</span>

<strong id="pengeluaranCash">
Rp0
</strong>

</div>


<div class="summary-row">

<span>Pengeluaran Non-Cash</span>

<strong id="pengeluaranNonCash">
Rp0
</strong>

</div>


<div class="summary-row summary-total">

<strong>Sisa Cash</strong>

<strong id="sisaCash">
Rp0
</strong>

</div>

</div>

</div>


<!-- =====================================================
     CATATAN
===================================================== -->

<div class="section">

<label>📝 Catatan</label>

<textarea
  id="catatan"
  placeholder="Catatan tambahan (opsional)"
></textarea>

</div>


<!-- =====================================================
     KIRIM
===================================================== -->

<button
  type="button"
  class="main-btn"
  id="kirimBtn"
  onclick="kirimLaporan()"
>

🚀 KIRIM LAPORAN

</button>


<div
  id="status"
  class="status"
></div>


<div class="note">

Pastikan angka sudah benar sebelum mengirim laporan.

</div>


</div>

</div>


<script>


/* =========================================================
   URL BACKEND
========================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxPBMSGLb-HV9yk7LPWb5HL1IKFYzaj5dL5DYJbHFPHyscKHFchso9UYvsxkTvbawxvdA/exec";


/* =========================================================
   DATA MASTER
========================================================= */

let masterCabang = [];

let sumberPengeluaran = [];

let users = [];

let sedangMengirim = false;


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function rupiah(angka){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(angka || 0);

}


/* =========================================================
   AMBIL ANGKA
========================================================= */

function angka(id){

  return Number(
    document.getElementById(id).value
  ) || 0;

}


/* =========================================================
   LOAD MASTER
========================================================= */

async function loadMaster(){

  try{

    const response =
      await fetch(SCRIPT_URL);

    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Gagal mengambil MASTER"
      );

    }


    masterCabang =
      result.master.cabang || [];


    sumberPengeluaran =
      result.master.sumberPengeluaran || [];


    users =
      result.master.users || [];


    isiDropdownPenginput();

    isiDropdownCabang();


  }catch(error){

    console.error(error);

    tampilStatus(
      "❌ Gagal memuat data MASTER. Periksa deployment backend.",
      "error"
    );

  }

}


/* =========================================================
   DROPDOWN PENGINPUT
========================================================= */

function isiDropdownPenginput(){

  const select =
    document.getElementById("penginput");


  select.innerHTML =
    '<option value="">Pilih nama penginput</option>';


  users
    .filter(function(user){

      return user.status === "AKTIF";

    })
    .forEach(function(user){

      const option =
        document.createElement("option");

      option.value =
        user.nama;

      option.textContent =
        user.nama +
        " — " +
        user.role;

      option.dataset.cabang =
        user.cabang;

      option.dataset.role =
        user.role;

      select.appendChild(option);

    });

}


/* =========================================================
   DROPDOWN CABANG
========================================================= */

function isiDropdownCabang(){

  const select =
    document.getElementById("cabang");


  select.innerHTML =
    '<option value="">Pilih cabang</option>';


  masterCabang.forEach(function(nama){

    const option =
      document.createElement("option");

    option.value =
      nama;

    option.textContent =
      nama;

    select.appendChild(option);

  });

}


/* =========================================================
   SAAT PENGINPUT DIPILIH
========================================================= */

document
  .getElementById("penginput")
  .addEventListener(
    "change",
    function(){

      const nama =
        this.value;

      const user =
        users.find(function(item){

          return (
            item.nama === nama &&
            item.status === "AKTIF"
          );

        });


      const cabangSelect =
        document.getElementById("cabang");

      const userInfo =
        document.getElementById("userInfo");


      if(!user){

        cabangSelect.disabled = false;

        cabangSelect.classList.remove(
          "locked"
        );

        cabangSelect.value = "";

        userInfo.classList.add(
          "hidden"
        );

        return;

      }


      userInfo.innerHTML =
        "Role: <strong>" +
        escapeHtml(user.role) +
        "</strong>";


      userInfo.classList.remove(
        "hidden"
      );


      /* ---------------------------------------------------
         KASIR
      --------------------------------------------------- */

      if(user.role === "KASIR"){

        cabangSelect.value =
          user.cabang;

        cabangSelect.disabled =
          true;

        cabangSelect.classList.add(
          "locked"
        );

      }


      /* ---------------------------------------------------
         OWNER
      --------------------------------------------------- */

      else if(user.role === "OWNER"){

        cabangSelect.disabled =
          false;

        cabangSelect.classList.remove(
          "locked"
        );

        cabangSelect.value = "";

      }


      else{

        cabangSelect.disabled =
          false;

        cabangSelect.classList.remove(
          "locked"
        );

      }

    }
  );


/* =========================================================
   HITUNG TOTAL PENDAPATAN
========================================================= */

function hitungPendapatan(){

  const total =
    angka("cash") +
    angka("transfer") +
    angka("qr") +
    angka("grab") +
    angka("gojek") +
    angka("shopee");


  document.getElementById(
    "totalPendapatan"
  ).innerText =
    rupiah(total);


  hitungRingkasan();

}


/* =========================================================
   TAMBAH PENGELUARAN
========================================================= */

function tambahPengeluaran(){

  const container =
    document.getElementById(
      "expenseList"
    );


  const index =
    container.children.length;


  const item =
    document.createElement("div");


  item.className =
    "expense-item";


  let sourceOptions =
    '<option value="">Pilih sumber</option>';


  sumberPengeluaran
    .forEach(function(sumber){

      sourceOptions +=
        `<option value="${escapeHtml(sumber)}">
          ${escapeHtml(sumber)}
        </option>`;

    });


  item.innerHTML = `

    <div class="expense-head">

      <div class="expense-number">

        Pengeluaran ${index + 1}

      </div>


      <button
        type="button"
        class="remove-btn"
        onclick="hapusPengeluaran(this)"
      >

        Hapus

      </button>

    </div>


    <label>Sumber</label>

    <select class="expense-source">

      ${sourceOptions}

    </select>


    <label>Keperluan</label>

    <input
      type="text"
      class="expense-name"
      placeholder="Contoh: Belanja pasar, gas, listrik"
    >


    <label>Metode Pembayaran</label>

    <select class="expense-method">

      <option value="CASH">
        CASH
      </option>

      <option value="TRANSFER">
        TRANSFER
      </option>

      <option value="QR">
        QR
      </option>

    </select>


    <label>Nominal</label>

    <input
      type="number"
      class="expense-amount"
      min="0"
      inputmode="numeric"
      placeholder="0"
      oninput="hitungRingkasan()"
    >

  `;


  container.appendChild(item);

  hitungRingkasan();

}


/* =========================================================
   HAPUS PENGELUARAN
========================================================= */

function hapusPengeluaran(button){

  const item =
    button.closest(
      ".expense-item"
    );


  if(item){

    item.remove();

  }


  rapikanNomorPengeluaran();

  hitungRingkasan();

}


/* =========================================================
   RAPIKAN NOMOR
========================================================= */

function rapikanNomorPengeluaran(){

  const items =
    document.querySelectorAll(
      ".expense-item"
    );


  items.forEach(
    function(item,index){

      item.querySelector(
        ".expense-number"
      ).innerText =
        "Pengeluaran " +
        (index + 1);

    }
  );

}


/* =========================================================
   HITUNG PENGELUARAN
========================================================= */

function hitungRingkasan(){

  let totalPengeluaran = 0;

  let totalCash = 0;

  let totalNonCash = 0;


  document
    .querySelectorAll(
      ".expense-item"
    )
    .forEach(
      function(item){

        const nominal =
          Number(
            item.querySelector(
              ".expense-amount"
            ).value
          ) || 0;


        const metode =
          item.querySelector(
            ".expense-method"
          ).value;


        totalPengeluaran +=
          nominal;


        if(metode === "CASH"){

          totalCash +=
            nominal;

        }else{

          totalNonCash +=
            nominal;

        }

      }
    );


  const cash =
    angka("cash");


  const totalPendapatan =
    angka("cash") +
    angka("transfer") +
    angka("qr") +
    angka("grab") +
    angka("gojek") +
    angka("shopee");


  const sisaCash =
    cash - totalCash;


  document.getElementById(
    "totalPendapatan"
  ).innerText =
    rupiah(totalPendapatan);


  document.getElementById(
    "totalPengeluaran"
  ).innerText =
    rupiah(totalPengeluaran);


  document.getElementById(
    "pengeluaranCash"
  ).innerText =
    rupiah(totalCash);


  document.getElementById(
    "pengeluaranNonCash"
  ).innerText =
    rupiah(totalNonCash);


  document.getElementById(
    "sisaCash"
  ).innerText =
    rupiah(sisaCash);

}


/* =========================================================
   KIRIM LAPORAN
========================================================= */

async function kirimLaporan(){

  if(sedangMengirim){

    return;

  }


  const penginput =
    document.getElementById(
      "penginput"
    ).value;


  if(!penginput){

    tampilStatus(
      "⚠️ Silakan pilih nama penginput.",
      "error"
    );

    return;

  }


  const user =
    users.find(function(item){

      return (
        item.nama === penginput &&
        item.status === "AKTIF"
      );

    });


  if(!user){

    tampilStatus(
      "⚠️ Penginput tidak ditemukan atau tidak aktif.",
      "error"
    );

    return;

  }


  const cabang =
    document.getElementById(
      "cabang"
    ).value;


  if(!cabang){

    tampilStatus(
      "⚠️ Silakan pilih cabang terlebih dahulu.",
      "error"
    );

    return;

  }


  /* -------------------------------------------------------
     VALIDASI KASIR
  ------------------------------------------------------- */

  if(
    user.role === "KASIR" &&
    user.cabang !== cabang
  ){

    tampilStatus(
      "❌ Kasir tidak memiliki akses ke cabang tersebut.",
      "error"
    );

    return;

  }


  const expenseItems =
    document.querySelectorAll(
      ".expense-item"
    );


  const pengeluaran = [];


  for(
    const item of expenseItems
  ){

    const sumber =
      item.querySelector(
        ".expense-source"
      ).value;


    const keperluan =
      item.querySelector(
        ".expense-name"
      ).value.trim();


    const metodePembayaran =
      item.querySelector(
        ".expense-method"
      ).value;


    const nominal =
      Number(
        item.querySelector(
          ".expense-amount"
        ).value
      ) || 0;


    if(
      !sumber &&
      !keperluan &&
      nominal === 0
    ){

      continue;

    }


    if(!sumber){

      tampilStatus(
        "⚠️ Pilih sumber untuk setiap pengeluaran.",
        "error"
      );

      return;

    }


    if(!keperluan){

      tampilStatus(
        "⚠️ Isi keperluan pengeluaran.",
        "error"
      );

      return;

    }


    if(nominal <= 0){

      tampilStatus(
        "⚠️ Isi nominal pengeluaran dengan benar.",
        "error"
      );

      return;

    }


    pengeluaran.push({

      sumber:
        sumber,

      keperluan:
        keperluan,

      metodePembayaran:
        metodePembayaran,

      nominal:
        nominal

    });

  }


  sedangMengirim = true;


  const tombol =
    document.getElementById(
      "kirimBtn"
    );


  tombol.disabled = true;


  tombol.innerText =
    "⏳ MENGIRIM LAPORAN...";


  tampilStatus(
    "⏳ Laporan sedang dikirim, jangan tutup halaman.",
    "loading"
  );


  try{


    /* =====================================================
       SIMPAN PENDAPATAN
    ===================================================== */

    const pendapatanData = {

      tipe:
        "pemasukan",

      penginput:
        penginput,

      cabang:
        cabang,

      cash:
        angka("cash"),

      transfer:
        angka("transfer"),

      qr:
        angka("qr"),

      grab:
        angka("grab"),

      gojek:
        angka("gojek"),

      shopee:
        angka("shopee"),

      catatan:
        document.getElementById(
          "catatan"
        ).value.trim()

    };


    const hasilPendapatan =
      await kirimKeBackend(
        pendapatanData
      );


    if(
      !hasilPendapatan.success
    ){

      throw new Error(
        hasilPendapatan.message ||
        "Pendapatan gagal disimpan"
      );

    }


    /* =====================================================
       SIMPAN SEMUA PENGELUARAN
    ===================================================== */

    for(
      const expense of pengeluaran
    ){

      const dataPengeluaran = {

        tipe:
          "pengeluaran",

        penginput:
          penginput,

        cabang:
          cabang,

        sumber:
          expense.sumber,

        keperluan:
          expense.keperluan,

        metodePembayaran:
          expense.metodePembayaran,

        nominal:
          expense.nominal,

        catatan:
          document.getElementById(
            "catatan"
          ).value.trim()

      };


      const hasilPengeluaran =
        await kirimKeBackend(
          dataPengeluaran
        );


      if(
        !hasilPengeluaran.success
      ){

        throw new Error(
          hasilPengeluaran.message ||
          "Pengeluaran gagal disimpan"
        );

      }

    }


    /* =====================================================
       BERHASIL
    ===================================================== */

    tampilStatus(
      "✅ TRANSAKSI BERHASIL — Laporan berhasil disimpan.",
      "success"
    );


    kosongkanForm();


  }catch(error){

    console.error(error);


    tampilStatus(
      "❌ TRANSAKSI GAGAL — Data belum berhasil disimpan. Form tetap dipertahankan.",
      "error"
    );


  }finally{

    sedangMengirim =
      false;


    tombol.disabled =
      false;


    tombol.innerText =
      "🚀 KIRIM LAPORAN";

  }

}


/* =========================================================
   KIRIM KE BACKEND
========================================================= */

async function kirimKeBackend(data){

  const response =
    await fetch(
      SCRIPT_URL,
      {
        method:"POST",
        body:JSON.stringify(data)
      }
    );


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "Backend mengembalikan respons yang tidak valid."
    );

  }


  return result;

}


/* =========================================================
   KOSONGKAN FORM
========================================================= */

function kosongkanForm(){

  document.getElementById(
    "penginput"
  ).value = "";


  document.getElementById(
    "cabang"
  ).value = "";


  document.getElementById(
    "cabang"
  ).disabled = false;


  document.getElementById(
    "cabang"
  ).classList.remove(
    "locked"
  );


  document.getElementById(
    "userInfo"
  ).classList.add(
    "hidden"
  );


  [
    "cash",
    "transfer",
    "qr",
    "grab",
    "gojek",
    "shopee"
  ].forEach(
    function(id){

      document.getElementById(
        id
      ).value = "";

    }
  );


  document.getElementById(
    "catatan"
  ).value = "";


  document.getElementById(
    "expenseList"
  ).innerHTML = "";


  document.getElementById(
    "totalPendapatan"
  ).innerText =

function tampilStatus(

  tipe
){

  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    pesan;


  status.className =
    "status " + tipe;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
